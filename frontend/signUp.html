<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKILLHIVE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header>
    <div data-include="./partials/navbar.html"></div>
  </header>

  <form id="signupForm" class="w-25 border p-3 container mt-5">
    <h5 class="text-center mb-4 h5">Sign Up</h5>
    <div class="mb-3">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName">
    </div>
    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password">
    </div>
    <div class="mb-3">
      <label for="repeatPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="repeatPassword">
    </div>
    <div class="mb-3 form-check">
      <p class="infoText text-center mt-4">Already have an account? <a href="./login.html">Sign In</a></p>
    </div>
    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="./scripts/include.js"></script>
  <script src="./scripts/app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const repeatPassword = document.getElementById('repeatPassword').value;
        if (!firstName) return alert('Please enter first name');
        if (!lastName) return alert('Please enter last name');
        if (!email) return alert('Please enter email');
        if (!password) return alert('Please enter password');
        if (!repeatPassword) return alert('Please repeat password');
        if (password !== repeatPassword) return alert('Passwords do not match');
        try {
            await SkillHive.auth.register({ firstName, lastName, email, password });
            window.location.href = './login.html';
        } catch (err) {
            alert(err.message);
        }
    });
  </script>
</body>
</html>
