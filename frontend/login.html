<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SKILLHIVE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header>
    <div data-include="./partials/navbar.html"></div>
  </header>

  <form id="loginForm" class="w-25 border p-3 container mt-5">
    <h5 class="text-center mb-4 h5">Login</h5>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password">
    </div>
    <div class="mb-3 form-check">
      <p class="infoText text-start">Forgot Password? <a href="#">Click Here</a></p>
      <p class="infoText text-center mt-4">Don't have an account? <a href="./signUp.html">Sign Up</a></p>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="./scripts/include.js"></script>
  <script src="./scripts/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email) return alert('Please enter email');
        if (!password) return alert('Please enter password');
        try {
            await SkillHive.auth.login({ email, password });
            window.location.href = './dashboard/';
        } catch (err) {
            alert(err.message);
        }
    });
  </script>
</body>
</html>
